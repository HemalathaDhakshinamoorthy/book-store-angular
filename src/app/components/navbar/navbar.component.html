<!-- Top Info Bar -->
<div class="top-bar">
  <span>📦 14 DAYS REFUND GUARANTEE</span>
  <span class="right">FAST DELIVERY | FREE DELIVERY OVER ₹5000</span>
</div>

<!-- Header -->
<header class="header">
  <div class="logo">
    <span class="brand"><b>The Reading Room</b></span>
    <p class="tagline">Grab a seat, open a book, and let your next story begin.</p>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" class="search-box">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput placeholder="Search over wide range of books" />
    </mat-form-field>
  </div>

  <div class="header-actions">
    <ng-container *ngIf="(isLoggedIn$ | async) === false; else loggedInTpl">
      <button mat-button routerLink="/login">Login</button>
      <button mat-button routerLink="/signup">Sign Up</button>
    </ng-container>

    <ng-template #loggedInTpl>
      <button mat-icon-button [matMenuTriggerFor]="accountMenu" aria-label="Account">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #accountMenu="matMenu">
        <button mat-menu-item routerLink="/profile">Profile</button>
        <button mat-menu-item (click)="logout()">Logout</button>
      </mat-menu>
      <button mat-icon-button aria-label="Cart">
        <mat-icon>shopping_cart</mat-icon>
      </button>
    </ng-template>
  </div>
</header>

<!-- Navigation Bar -->
<nav class="nav-bar">
  <a routerLink="/book-carousel">Home</a>
  <a *ngIf="isAdmin$ | async" routerLink="/booklist">All Books(Grid View)</a>
  <a routerLink="/bestsellers">Bestsellers</a>
  <a routerLink="/computer-science">Computer Science</a>
  <a routerLink="/entertainment">Entertainment</a>
  <a routerLink="/education">Education</a>
  <a routerLink="/puzzles">Puzzles</a>
  <a routerLink="/story">Story</a>
  <a routerLink="/health">Health</a>
</nav>
